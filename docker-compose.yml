version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulse_db
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: muhammad
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: saas_pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pulse_redis
    ports:
      - "6389:6379"

volumes:
  postgres_data:
